name: Finalize and validate academic website
on:
  push:
    branches: [codex/recover-academic-site]
    paths: [.github/workflows/recover-website.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Restore photo and validate website assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          
          data_path = Path("data.js")
          text = data_path.read_text()
          data = json.loads(text.split("window.SITE_DATA = ", 1)[1].strip().removesuffix(";"))
          assert len(data["publications"]) == 23
          assert len(data["awards"]) == 14
          assert len(data["talks"]) == 25
          assert len(data["abstracts"]) == 10
          photo = next(p for p in data["photos"] if p["src"] == "assets/life/life-01.jpg")
          url = photo["original_url"]
          assert urlparse(url).scheme == "https"
          assert urlparse(url).hostname == "lh7-us.googleusercontent.com"
          restored = False
          try:
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  raw = response.read(12_000_001)
              assert 1000 < len(raw) <= 12_000_000, "Unexpected image size"
              if raw.startswith(b"\x89PNG\r\n\x1a\n"):
                  extension = "png"
              elif raw.startswith(b"\xff\xd8\xff"):
                  extension = "jpg"
              elif raw.startswith(b"RIFF") and raw[8:12] == b"WEBP":
                  extension = "webp"
              else:
                  raise ValueError("Source did not return a recognized image")
              photo["src"] = "assets/life/life-01." + extension
              Path(photo["src"]).write_bytes(raw)
              restored = True
              print("Restored original photo:", photo["src"], len(raw), "bytes")
          except Exception as exc:
              print("Original photo could not be restored:", type(exc).__name__, str(exc))
              data["photos"] = [p for p in data["photos"] if p is not photo]
              data["photos"][0]["size"] = "large"
          data_path.write_text("/* CV and verified public sources. */\nwindow.SITE_DATA = " + json.dumps(data, ensure_ascii=False, indent=2) + ";\n")
          assert len(data["photos"]) == (8 if restored else 7)
          
          asset_paths = set()
          def inspect(value):
              if isinstance(value, dict):
                  for item in value.values():
                      inspect(item)
              elif isinstance(value, list):
                  for item in value:
                      inspect(item)
              elif isinstance(value, str) and value.startswith("assets/"):
                  asset_paths.add(value)
          inspect(data)
          
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.references = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  for key in ("src", "href"):
                      if attrs.get(key):
                          self.references.append(attrs[key])
          parser = Links()
          parser.feed(Path("index.html").read_text())
          for ref in parser.references:
              if ref.startswith("#"):
                  assert ref[1:] in parser.ids, "Missing anchor: " + ref
              elif not urlparse(ref).scheme and not ref.startswith("//"):
                  path = unquote(urlparse(ref).path)
                  if path:
                      asset_paths.add(path)
          for name in sorted(asset_paths):
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 0, "Missing or empty asset: " + name
          assert not Path("CNAME").exists()
          assert not Path("Kevin-Tu-GitHub-Pages-repaired.zip").exists()
          print("Validated", len(asset_paths), "local asset references and all HTML anchors.")
          print("Content counts: 23 publications, 14 awards, 25 talks, 10 abstracts,", len(data["photos"]), "photos.")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
      - name: Save finalized website on the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize photo recovery and validate academic website"
          git push origin HEAD:codex/recover-academic-site
