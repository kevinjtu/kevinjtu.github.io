name: Recover verified academic website
on:
  push:
    branches: [codex/recover-academic-site]
    paths: [.github/workflows/recover-website.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify and recover the uploaded website
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          expected = json.loads("{\".nojekyll\":\"8b137891791fe96927ad78e64b0aad7bded08bdc\",\"README.md\":\"da9c54a052b749d161e1761a33333ce93c00f0eb\",\"SOURCES.md\":\"06e981263c54289c5c0970c299da8649cdc41d9a\",\"app.js\":\"59fe082f32a648a457bc5ce56c346ba19854554c\",\"assets/cambridge.svg\":\"3877783d4633dd39d0d9b5a65ec68ee4be982697\",\"assets/favicon.svg\":\"889d7ae55201ac7f6a59d737ae79979e7d1f1084\",\"assets/fonts/OFL.txt\":\"21f6aff961064c2e429f570995e446bcdd555422\",\"assets/fonts/inter-latin.ttf\":\"5b8b67110adf942c14c1aaa0b10bfcc9c9e2c33e\",\"assets/life/life-01.jpg\":\"2529ed505c874c9ccaa363f1a8b41653a7a4b657\",\"assets/life/life-03.jpg\":\"cb4ae8b99030f8e2d1cabee5acce7cabade764d2\",\"assets/life/life-04.jpg\":\"d0b4496ed82a88f1f070f33388aaf7f2a589af08\",\"assets/life/life-05.jpg\":\"8fb98a6e4e4ead3702a3ca990d580e7efed7dd30\",\"assets/life/life-06.jpg\":\"d79f88d8ac1d390d5cb9c946fb2b49a2fe418a0f\",\"assets/life/life-07.jpg\":\"eb752881832b357726ae86c546966fd181fcda06\",\"assets/life/life-08.jpg\":\"fae554f3a2234db939768960ff0211aee2357a6b\",\"assets/life/life-09.jpg\":\"449497aea99800055e0bacb4e5059ce2d15c6f80\",\"assets/news-0.jpg\":\"299d752a5464d0d776cd033189045a9414d324ae\",\"assets/news-2.jpg\":\"8369024f160ed1738d8d5905efedf7e0a67ceb1d\",\"assets/news-4.jpg\":\"1fbac3de3b0d4acc1c6c6f0552c94778b02721c1\",\"assets/papers/breast.jpg\":\"762bab9139375da7107838164cfe8d5c3a0f79ea\",\"assets/papers/hif1a.jpg\":\"844deffbba4e062821db43d5614b78f6eeab19dd\",\"assets/papers/metis.jpg\":\"2ff6659fa38248bbc8ed8cafe65c8dd231126b76\",\"assets/papers/microglia.jpg\":\"d4a41989273b850cbcd6c49d8ab97c0b15af812b\",\"assets/papers/realtime.jpg\":\"0636938f06fab5627516caa9ad74ce68fdf49641\",\"assets/papers/tert.jpg\":\"956bd1716fc2060fb732c9810fa28a82653090d6\",\"assets/portrait.jpg\":\"9c1b69f5432a1aecb2e26df5b59be6b6c1cdf21a\",\"assets/umb.svg\":\"717667976cc6f7d4c30f680bc9f25ae80afae897\",\"assets/umd.svg\":\"c909b00678fe54574d15fdcd2863691f4c6f5c07\",\"data.js\":\"3130f4be2fb79238c1a7c7212828c1560beac80f\",\"index.html\":\"e1f3365077b89dc14fb5987896807888760dd269\",\"styles.css\":\"dbbe8890f7c80cb167ca7949b63cd755ee4aa9d9\"}")
          archive_path = Path("Kevin-Tu-GitHub-Pages-repaired.zip")
          prefix = "kevinjtu.github.io/"
          recovered = {}
          with zipfile.ZipFile(archive_path) as archive:
              entries = archive.infolist()
              assert len(entries) == len(expected), "Unexpected archive file count"
              assert len({i.filename for i in entries}) == len(entries), "Duplicate paths"
              assert all(i.filename.startswith(prefix) for i in entries), "Unexpected prefix"
              assert {i.filename[len(prefix):] for i in entries} == set(expected), "Unexpected files"
              for info in entries:
                  name = info.filename[len(prefix):]
                  assert info.file_size < 2_000_000, "Unexpected file size"
                  contents = archive.read(info)
                  if name == "assets/life/life-01.jpg" and len(contents) == 0:
                      print("Omitting the known empty photo:", name)
                      continue
                  sha = hashlib.sha1(b"blob " + str(len(contents)).encode() + b"\0" + contents).hexdigest()
                  assert sha == expected[name], "Recovered file differs from verified original: " + name
                  recovered[name] = contents
                  print("Verified", name, len(contents), sha)
          assert len(recovered) == 30
          for name, contents in recovered.items():
              dest = Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(contents)
          Path("CNAME").unlink(missing_ok=True)
          archive_path.unlink()
          print("Recovered 30 files; every recovered file matches its original Git blob hash.")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
      - name: Save recovered files to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover verified academic website files from uploaded archive"
          git push origin HEAD:codex/recover-academic-site
