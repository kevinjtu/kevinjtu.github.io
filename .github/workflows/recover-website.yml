name: Verify live GitHub Pages website
on:
  push:
    branches: [codex/recover-academic-site]
    paths: [.github/workflows/recover-website.yml]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Verify live homepage and essential assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          base = "https://kevinjtu.github.io/"
          revision = "8467410ad35ae0612c60b28ff3cee214a06ceac7"
          expected = Path("index.html").read_bytes()
          for attempt in range(8):
              try:
                  request = urllib.request.Request(base + "?deployment=" + revision, headers={"Cache-Control": "no-cache", "User-Agent": "Kevin-Tu-site-deployment-check"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      actual = response.read()
                      final_url = response.geturl()
                  assert urlparse(final_url).hostname == "kevinjtu.github.io", "Unexpected redirect: " + final_url
                  assert actual == expected, "Public homepage has not updated yet"
                  print("Verified live homepage:", final_url, len(actual), "bytes")
                  break
              except Exception as exc:
                  print("Waiting for Pages propagation:", type(exc).__name__, str(exc), flush=True)
                  if attempt == 7:
                      raise
                  time.sleep(10)
          for asset in ["app.js", "data.js", "styles.css", "assets/portrait.jpg", "assets/fonts/inter-latin.ttf"]:
              with urllib.request.urlopen(base + asset + "?deployment=" + revision, timeout=15) as response:
                  actual = response.read()
              assert actual == Path(asset).read_bytes(), "Live asset differs from published file: " + asset
              print("Verified live asset:", asset, len(actual), "bytes")
          print("LIVE_VERIFICATION_PASSED", base)
          PY
